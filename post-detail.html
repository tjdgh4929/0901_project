<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="기록의 온도 게시글">
  <title>게시글 — 기록의 온도</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">記</span><span>기록의 온도</span></a>
      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a class="active" href="index.html">글</a><a href="profile.html">소개</a><a href="write.html">글쓰기</a>
        <span class="nav-divider"></span><a href="login.html">로그인</a><a class="nav-cta" href="signup.html">시작하기</a>
      </nav>
    </div>
  </header>
  <main>
    <p class="article-error container" data-post-error hidden></p>
    <article data-article hidden>
      <header class="article-header container">
        <span class="category" data-post-category></span>
        <h1 data-post-title>게시글을 불러오는 중입니다.</h1>
        <div class="article-meta">
          <span data-post-author></span><span>·</span><time data-post-date></time><span>·</span><span data-post-read></span>
        </div>
      </header>
      <div class="article-cover" role="img" aria-label="게시글 표지">{ story }</div>
      <div class="container article-layout">
        <aside class="share-rail" aria-label="글 반응 및 공유">
          <button class="icon-button" type="button" data-like aria-label="좋아요" aria-pressed="false">♡</button>
          <button class="icon-button" type="button" data-copy aria-label="링크 복사">↗</button>
        </aside>
        <div class="article-body">
          <p class="lead" data-post-summary></p>
          <div class="article-copy" data-post-content></div>
          <div class="article-author">
            <span class="profile-avatar small" data-post-author-initial aria-hidden="true">?</span>
            <div><strong data-post-author></strong><p>이 글을 작성한 사용자입니다.</p></div>
          </div>
          <nav class="article-nav"><a href="index.html">← 모든 글로 돌아가기</a></nav>
        </div>
      </div>
    </article>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><a class="brand" href="index.html"><span class="brand-mark">記</span><span>기록의 온도</span></a><p>© 2026 기록의 온도</p></div></footer>
  <script src="js/main.js"></script>
</body>
</html>
