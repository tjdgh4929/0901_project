<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 — 기록의 온도</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">記</span><span>기록의 온도</span></a><a class="text-link small" href="index.html">블로그로 돌아가기 →</a></div></header>
<main class="auth-page"><section class="auth-visual"><div class="auth-quote"><p>“첫 문장은 완벽하지 않아도<br>좋은 기록의 시작이 됩니다.”</p><span>오늘의 생각에 작은 주소를 만들어 보세요.</span></div></section><section class="auth-panel"><div class="auth-card"><p class="eyebrow">JOIN THE STORY</p><h1>당신의 기록을 시작하세요.</h1><p class="auth-sub">간단한 정보만 입력하면 바로 시작할 수 있어요.</p><form class="auth-form" novalidate data-success="회원가입이 완료되었습니다. (데모)"><div class="success-box" hidden></div><div class="field-row"><div class="field"><label for="signup-name">이름</label><input id="signup-name" name="name" type="text" autocomplete="name" placeholder="김민준" required><p class="field-error"></p></div><div class="field"><label for="signup-nickname">필명</label><input id="signup-nickname" name="nickname" type="text" placeholder="minjune" required><p class="field-error"></p></div></div><div class="field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><p class="field-error"></p></div><div class="field"><label for="signup-password">비밀번호</label><div class="password-wrap"><input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="8자 이상 입력" required><button class="password-toggle" type="button">보기</button></div><p class="field-error"></p></div><div class="field"><label for="signup-confirm">비밀번호 확인</label><input id="signup-confirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="한 번 더 입력" required><p class="field-error"></p></div><div class="form-options"><label class="check"><input type="checkbox" required> 이용약관 및 개인정보 처리방침에 동의합니다.</label></div><button class="button primary" type="submit">계정 만들기</button></form><p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p></div></section></main><script src="js/main.js"></script></body></html>
