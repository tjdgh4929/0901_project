<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>프로필 — 기록의 온도</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">記</span><span>기록의 온도</span></a>
      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="index.html">글</a><a class="active" href="profile.html">프로필</a><a href="write.html">글쓰기</a>
        <span class="nav-divider"></span><a href="login.html">로그인</a><a class="nav-cta" href="signup.html">시작하기</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-hero center">
      <div class="container">
        <p class="eyebrow">MY PROFILE</p>
        <h1 class="page-title">프로필과 작성한 글</h1>
        <p class="page-intro">로그인 계정 정보와 작성한 게시글을 한곳에서 관리합니다.</p>
      </div>
    </section>
    <section class="section">
      <div class="container profile-layout">
        <aside class="profile-aside">
          <span class="profile-avatar" data-profile-initial aria-hidden="true">?</span>
          <h2 data-profile-name>프로필</h2>
          <p data-profile-email>로그인 후 계정 정보를 확인할 수 있습니다.</p>
        </aside>
        <div class="profile-body">
          <div id="profile-guest" class="profile-guest">
            <p class="eyebrow">SIGN IN REQUIRED</p>
            <h2>내 글을 관리하려면 로그인해 주세요.</h2>
            <p>로그인하면 작성한 글의 공개 상태를 확인하고 수정하거나 삭제할 수 있습니다.</p>
            <a class="button primary" href="login.html">로그인</a>
          </div>
          <section id="my-posts-section" class="post-manager" hidden>
            <div class="manager-heading">
              <div><p class="eyebrow">MY STORIES</p><h2>내 글 관리</h2></div>
              <a class="button primary" href="write.html">새 글 쓰기</a>
            </div>
            <div id="my-posts" class="manage-list" aria-live="polite"></div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><a class="brand" href="index.html"><span class="brand-mark">記</span><span>기록의 온도</span></a><p>© 2026 기록의 온도</p></div></footer>
  <script src="js/main.js"></script>
</body>
</html>
