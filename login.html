<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 — 기록의 온도</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">記</span><span>기록의 온도</span></a><a class="text-link small" href="index.html">블로그로 돌아가기 →</a></div></header>
<main class="auth-page"><section class="auth-visual"><div class="auth-quote"><p>“나의 언어로 남긴 기록은<br>시간이 지나도 나를 설명해 줍니다.”</p><span>쓰고, 나누고, 오래 간직하세요.</span></div></section><section class="auth-panel"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>다시 만나 반가워요.</h1><p class="auth-sub">로그인하고 당신의 기록을 이어가세요.</p><form class="auth-form" novalidate data-auth-action="login"><div class="success-box" hidden role="status"></div><div class="field"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><p class="field-error"></p></div><div class="field"><label for="login-password">비밀번호</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required><button class="password-toggle" type="button">보기</button></div><p class="field-error"></p></div><div class="form-options"><label class="check"><input type="checkbox" name="remember"> 로그인 유지</label><a href="#">비밀번호 찾기</a></div><button class="button primary" type="submit">로그인</button></form><p class="auth-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p></div></section></main><script src="js/main.js"></script></body></html>
